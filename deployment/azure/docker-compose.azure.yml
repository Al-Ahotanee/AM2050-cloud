services:
  app:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: am2050-app:latest
    container_name: am2050-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:10000:10000"
    environment:
      PORT: "10000"
      APP_ENV: "production"
      APP_URL: "${APP_URL}"
      DB_HOST: "${DB_HOST}"
      DB_PORT: "${DB_PORT:-3306}"
      DB_NAME: "${DB_NAME:-am2050_production}"
      DB_USER: "${DB_USER}"
      DB_PASS: "${DB_PASS}"
      JWT_SECRET: "${JWT_SECRET}"
      JWT_ISSUER: "${APP_URL}"
      JWT_AUDIENCE: "am2050-clients"
      ACCESS_TOKEN_TTL_SECONDS: "900"
      REFRESH_TOKEN_TTL_SECONDS: "604800"
      CORS_ALLOWED_ORIGIN: "${APP_URL}"
      COOKIE_SECURE: "true"
      COOKIE_SAMESITE: "Strict"
      APP_TIMEZONE: "Africa/Lagos"
      CLOUDINARY_CLOUD_NAME: "${CLOUDINARY_CLOUD_NAME:-dxnbuqcfy}"
      CLOUDINARY_API_KEY: "${CLOUDINARY_API_KEY:-346594288951922}"
      CLOUDINARY_API_SECRET: "${CLOUDINARY_API_SECRET:-ZyOV7-jT3MW-ks_LyIlDjCRfK5E}"
      CLOUDINARY_PRODUCT_ENV: "${CLOUDINARY_PRODUCT_ENV:-dxnbuqcfy}"
      TAGLINE: "ZERO OUT FOR SCHOOL IN CHILDREN IN AREWA BY 2050"
    env_file:
      - path: .env
        required: false
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:10000/api/v1/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s
